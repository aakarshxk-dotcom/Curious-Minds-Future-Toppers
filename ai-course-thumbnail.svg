<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0D17"/>
      <stop offset="25%" style="stop-color:#1a103a"/>
      <stop offset="50%" style="stop-color:#0d1b2a"/>
      <stop offset="75%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#070B14"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0.6"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.04">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="250" y1="0" x2="250" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="350" y1="0" x2="350" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="550" y1="0" x2="550" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="650" y1="0" x2="650" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="450" stroke="#8B5CF6" stroke-width="1"/>
  </g>

  <!-- Glowing orbs -->
  <circle cx="200" cy="150" r="180" fill="url(#orb1)"/>
  <circle cx="600" cy="300" r="150" fill="url(#orb2)"/>
  <circle cx="400" cy="100" r="100" fill="url(#orb1)" opacity="0.5"/>

  <!-- Neural network nodes -->
  <g filter="url(#glow)">
    <!-- Left cluster -->
    <circle cx="120" cy="100" r="5" fill="#8B5CF6" opacity="0.6"/>
    <circle cx="160" cy="140" r="4" fill="#A78BFA" opacity="0.5"/>
    <circle cx="90" cy="180" r="6" fill="#06B6D4" opacity="0.5"/>
    <circle cx="180" cy="200" r="3" fill="#8B5CF6" opacity="0.4"/>
    <line x1="120" y1="100" x2="160" y2="140" stroke="#8B5CF6" stroke-width="0.8" opacity="0.2"/>
    <line x1="160" y1="140" x2="90" y2="180" stroke="#A78BFA" stroke-width="0.6" opacity="0.15"/>
    <line x1="90" y1="180" x2="180" y2="200" stroke="#06B6D4" stroke-width="0.8" opacity="0.2"/>

    <!-- Right cluster -->
    <circle cx="650" cy="120" r="5" fill="#22D3EE" opacity="0.5"/>
    <circle cx="700" cy="160" r="4" fill="#8B5CF6" opacity="0.4"/>
    <circle cx="680" cy="100" r="3" fill="#C084FC" opacity="0.6"/>
    <line x1="650" y1="120" x2="700" y2="160" stroke="#22D3EE" stroke-width="0.8" opacity="0.2"/>
    <line x1="680" y1="100" x2="650" y2="120" stroke="#C084FC" stroke-width="0.6" opacity="0.15"/>

    <!-- Bottom cluster -->
    <circle cx="100" cy="350" r="4" fill="#06B6D4" opacity="0.4"/>
    <circle cx="140" cy="380" r="5" fill="#8B5CF6" opacity="0.3"/>
    <circle cx="70" cy="400" r="3" fill="#22D3EE" opacity="0.5"/>
    <line x1="100" y1="350" x2="140" y2="380" stroke="#06B6D4" stroke-width="0.6" opacity="0.15"/>

    <circle cx="680" cy="350" r="5" fill="#8B5CF6" opacity="0.4"/>
    <circle cx="720" cy="380" r="3" fill="#22D3EE" opacity="0.3"/>
    <line x1="680" y1="350" x2="720" y2="380" stroke="#8B5CF6" stroke-width="0.6" opacity="0.15"/>
  </g>

  <!-- Central brain/AI icon -->
  <g transform="translate(400, 180)" filter="url(#glow)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#glow1)" stroke-width="1.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#glow2)" stroke-width="1" opacity="0.2"/>

    <!-- AI Brain shape -->
    <path d="M-30,-40 C-45,-40 -55,-25 -50,-10 C-55,0 -50,15 -40,20 C-45,35 -30,50 -15,45 C-5,55 15,55 25,45 C40,50 55,35 50,20 C60,15 65,0 60,-10 C65,-25 55,-40 40,-40 C35,-50 -35,-50 -30,-40 Z"
          fill="url(#glow1)" opacity="0.15" stroke="url(#glow1)" stroke-width="2"/>

    <!-- Neural paths inside brain -->
    <g stroke="#C084FC" stroke-width="1.2" fill="none" opacity="0.6">
      <path d="M-20,-30 C-10,-20 0,-25 10,-15"/>
      <path d="M-30,-10 C-15,0 5,5 20,-5"/>
      <path d="M-25,15 C-10,10 10,20 25,10"/>
      <path d="M0,-35 C0,-20 0,0 0,25"/>
      <path d="M-15,-20 C-5,-10 5,-15 15,-25"/>
    </g>

    <!-- Neural dots -->
    <g fill="#22D3EE">
      <circle cx="0" cy="0" r="4" opacity="0.9"/>
      <circle cx="-20" cy="-25" r="3" opacity="0.7"/>
      <circle cx="15" cy="-18" r="3" opacity="0.7"/>
      <circle cx="-25" cy="5" r="2.5" opacity="0.6"/>
      <circle cx="22" cy="0" r="2.5" opacity="0.6"/>
      <circle cx="-15" cy="20" r="3" opacity="0.7"/>
      <circle cx="18" cy="15" r="3" opacity="0.7"/>
      <circle cx="0" cy="-30" r="2.5" opacity="0.5"/>
      <circle cx="0" cy="25" r="2.5" opacity="0.5"/>
    </g>

    <!-- Center spark -->
    <circle cx="0" cy="0" r="6" fill="#fff" opacity="0.9" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="3" fill="#8B5CF6"/>
  </g>

  <!-- Title text -->
  <text x="400" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="url(#glow1)" filter="url(#blur1)">Learn AI</text>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A78BFA" opacity="0.8">How To Use Artificial Intelligence</text>

  <!-- Bottom accent line -->
  <line x1="300" y1="365" x2="500" y2="365" stroke="url(#glow2)" stroke-width="2" opacity="0.5"/>

  <!-- Tag badges -->
  <rect x="220" y="378" width="70" height="24" rx="12" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="255" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#C084FC">Beginner</text>

  <rect x="300" y="378" width="80" height="24" rx="12" fill="#06B6D4" opacity="0.2" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="340" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#22D3EE">Skill Learning</text>

  <rect x="390" y="378" width="55" height="24" rx="12" fill="#F472B6" opacity="0.2" stroke="#F472B6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="417" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#F472B6">Live ✦</text>

  <!-- Decorative particles -->
  <g fill="#8B5CF6" opacity="0.4">
    <circle cx="50" cy="50" r="2"/>
    <circle cx="750" cy="80" r="1.5"/>
    <circle cx="30" cy="250" r="1.5"/>
    <circle cx="770" cy="230" r="2"/>
    <circle cx="350" cy="30" r="1.5"/>
    <circle cx="500" cy="420" r="1.5"/>
    <circle cx="250" cy="420" r="2"/>
    <circle cx="600" cy="30" r="1.5"/>
  </g>

  <!-- Floating AI symbols -->
  <g font-family="monospace" font-size="11" opacity="0.08" fill="#C084FC">
    <text x="60" cy="290" y="290">AI</text>
    <text x="720" y="270">ML</text>
    <text x="30" y="130">NLP</text>
    <text x="740" y="150">GPT</text>
    <text x="350" y="420"> neural </text>
  </g>
</svg>